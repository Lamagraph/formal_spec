# Dependabot configuration — GitHub Actions only. Conventions, rationale
# (manual opam updates), and activation: see the "Dependabot" subsection in
# docs/developer.md.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
