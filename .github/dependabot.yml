# Dependabot configuration. Tracks GitHub Actions only — Dependabot has no
# opam ecosystem, so the opam dependencies (dune, rocq-core, rocq-stdlib,
# odoc) are updated manually; see "Dependabot" in docs/developer.md for the
# rationale and the PR-handling convention.
#
# Note: Dependabot reads this file from the default branch (main), so it
# activates at the next release even though PRs target dev.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
